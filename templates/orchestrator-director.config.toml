# Primary-session config profile. Install at <CODEX_HOME>/orchestrator-director.config.toml.
# Set CODEX_HOME to that home and run `codex --profile orchestrator-director`
# from the target project directory.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
service_tier = "standard"

[agents]
enabled = true
# This cap applies to spawned child threads and excludes the primary session.
max_concurrent_threads_per_session = 4
